      .badge {
    position: absolute !important;
    top: -17px !important;
    right: -16px !important;

    min-width: 26px !important;
    height: 26px !important;
    padding: 2px !important;

    display: flex !important;
    justify-content: center !important;
    align-items: center !important;

    border-radius: 50% !important;

    background:
      radial-gradient(circle at 34% 20%, rgba(255,165,165,1), rgba(225,42,42,0.98) 34%, rgba(158,14,14,1) 68%, rgba(72,0,0,0.98) 100%) !important;

    color: #fff7f7 !important;

    font-size: 13px !important;
    line-height: 1 !important;
    font-weight: 900 !important;

    border-top: 1px solid rgba(255,255,255,0.50) !important;
    border-left: 1px solid rgba(255,255,255,0.24) !important;
    border-right: 1px solid rgba(60,0,0,0.42) !important;
    border-bottom: 1px solid rgba(25,0,0,0.68) !important;

    box-shadow:
      0 5px 9px rgba(0,0,0,0.32),
      inset 0 3px 6px rgba(255,255,255,0.16),
      inset 0 -9px 13px rgba(45,0,0,0.42),
      inset 5px 0 8px rgba(255,255,255,0.08),
      inset -5px 0 8px rgba(25,0,0,0.28) !important;

    text-shadow:
      0 -1px 0 rgba(50,0,0,0.58),
      0 1px 0 rgba(255,255,255,0.38),
      0 2px 2px rgba(40,0,0,0.44);

    z-index: 100 !important;
    pointer-events: none !important;
    overflow: hidden !important;

    animation:
      badgePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      badgeNervous 1.6s ease-in-out infinite 0.6s;

    transform-origin: center center;
  }

  .badge::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 4px;
    right: 4px;
    height: 34%;
    border-radius: 50%;

    background:
      linear-gradient(to bottom, rgba(255,255,255,0.48), rgba(255,255,255,0.04));

    pointer-events: none;
    opacity: 0.68;
    z-index: 1;
  }

  .badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;

    background:
      linear-gradient(145deg, rgba(255,255,255,0.12), transparent 34%, rgba(55,0,0,0.26));

    pointer-events: none;
    z-index: 1;
  }

  .badge span,
  .badge div {
    position: relative;
    z-index: 2;
  }

  @keyframes badgePop {
    0% {
      transform: scale(0) rotate(-14deg);
    }
    70% {
      transform: scale(1.14) rotate(6deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }

  @keyframes badgeNervous {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
    }
    12% {
      transform: translateY(-2px) rotate(-4deg) scale(1.03);
    }
    24% {
      transform: translateY(1px) rotate(3deg) scale(0.99);
    }
    36% {
      transform: translateY(-1px) rotate(-2deg) scale(1.02);
    }
    48% {
      transform: translateY(0) rotate(1deg) scale(1);
    }
    100% {
      transform: translateY(0) rotate(0deg) scale(1);
    }
  }
